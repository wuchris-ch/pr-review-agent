<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title description">
  <title id="title">Pull request review agent architecture</title>
  <desc id="description">Local and GitHub inputs cross an untrusted-input boundary, are hashed and partitioned into bounded model requests, validated against a strict contract, and published as machine JSON or a GitHub review. Metadata-only telemetry is exported separately.</desc>
  <defs>
    <style>
      :root {
        --canvas: #ffffff; --ink: #202533; --muted: #667085; --line: #d8dde8; --flow: #7b8799; --card: #ffffff;
        --blue: #eef7ff; --blue-line: #83b8e8; --amber: #fff9e9; --amber-line: #dfb765;
        --violet: #f7f1ff; --violet-line: #a58bdd; --green: #effaf3; --green-line: #7fbc92;
        --rose: #fff2f4; --rose-line: #dc929f; --gate: #7765c8; --gate-ink: #ffffff;
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
      .canvas { fill: var(--canvas); }
      .group { stroke-width: 1.5; }
      .blue-group { fill: var(--blue); stroke: var(--blue-line); }
      .amber-group { fill: var(--amber); stroke: var(--amber-line); }
      .violet-group { fill: var(--violet); stroke: var(--violet-line); }
      .green-group { fill: var(--green); stroke: var(--green-line); }
      .rose-group { fill: var(--rose); stroke: var(--rose-line); }
      .card { fill: var(--card); stroke: var(--line); stroke-width: 1.25; }
      .boundary { fill: none; stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 7 6; }
      .flow { fill: none; stroke: var(--flow); stroke-width: 1.8; marker-end: url(#arrow); }
      .telemetry { fill: none; stroke: var(--violet-line); stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#violet-arrow); }
      .title { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
      .subtitle { font-size: 15px; fill: var(--muted); }
      .section { font-size: 12px; font-weight: 700; letter-spacing: 0.11em; fill: var(--muted); }
      .node-title { font-size: 16px; font-weight: 650; }
      .detail { font-size: 13px; fill: var(--muted); }
      .small { font-size: 11px; fill: var(--muted); }
      .step { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: var(--muted); }
      .gate { fill: var(--gate); }
      .gate-title { font-size: 17px; font-weight: 700; fill: var(--gate-ink); }
      .gate-detail { font-size: 13px; fill: var(--gate-ink); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="var(--flow)"/>
    </marker>
    <marker id="violet-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="var(--violet-line)"/>
    </marker>
  </defs>

  <rect class="canvas" width="1440" height="850"/>
  <text class="title" x="54" y="52">Pull-request review with guardrails on both sides of the model</text>
  <text class="subtitle" x="54" y="78">Head-specific automation, bounded diffs, strict verdicts, and metadata-only observability</text>

  <rect class="group blue-group" x="54" y="112" width="390" height="160" rx="12"/>
  <text class="section" x="78" y="139">CONTINUOUS WATCHER</text>
  <rect class="card" x="78" y="158" width="342" height="88" rx="8"/>
  <text class="node-title" x="98" y="185">GitHub pull requests</text>
  <text class="detail" x="98" y="208">Poll every 60 seconds</text>
  <text class="detail" x="98" y="229">Review each head SHA once per policy version</text>

  <rect class="group amber-group" x="474" y="112" width="390" height="160" rx="12"/>
  <text class="section" x="498" y="139">LOCAL AND AUTOMATED INPUTS</text>
  <rect class="card" x="498" y="158" width="342" height="88" rx="8"/>
  <text class="node-title" x="518" y="185">Working tree, PR number, or raw diff</text>
  <text class="detail" x="518" y="208">pr-review / pr-review-pr / standard input</text>
  <text class="detail" x="518" y="229">No source checkout required for remote review</text>

  <rect class="group violet-group" x="894" y="112" width="492" height="160" rx="12"/>
  <text class="section" x="918" y="139">REPOSITORY CONTEXT</text>
  <rect class="card" x="918" y="158" width="444" height="88" rx="8"/>
  <text class="node-title" x="938" y="185">Optional root AGENTS.md guidance</text>
  <text class="detail" x="938" y="208">Priorities and conventions only</text>
  <text class="detail" x="938" y="229">Cannot change system rules or the output contract</text>

  <path class="flow" d="M249 272 V310 H205 V355"/>
  <path class="flow" d="M669 272 V310 H522 V355"/>
  <path class="flow" d="M1140 272 V310 H845 V355"/>

  <rect class="boundary" x="54" y="326" width="1332" height="300" rx="14"/>
  <text class="section" x="78" y="355">UNTRUSTED INPUT BOUNDARY</text>

  <text class="step" x="78" y="392">01  INGEST</text>
  <rect class="card" x="78" y="407" width="254" height="142" rx="9"/>
  <text class="node-title" x="98" y="438">Bind the exact diff</text>
  <text class="detail" x="98" y="464">Validate UTF-8 + input limits</text>
  <text class="detail" x="98" y="487">Compute SHA-256 before decoding</text>
  <text class="detail" x="98" y="510">Treat guidance as untrusted context</text>
  <text class="small" x="98" y="534">Empty or malformed input fails closed</text>

  <text class="step" x="378" y="392">02  PARTITION</text>
  <rect class="card" x="378" y="407" width="254" height="142" rx="9"/>
  <text class="node-title" x="398" y="438">Bound every request</text>
  <text class="detail" x="398" y="464">Split large diffs at file boundaries</text>
  <text class="detail" x="398" y="487">Preserve complete-file context</text>
  <text class="detail" x="398" y="510">Keep one digest for the full diff</text>
  <text class="small" x="398" y="534">Oversized single files are rejected</text>

  <text class="step" x="678" y="392">03  REVIEW</text>
  <rect class="card" x="678" y="407" width="254" height="142" rx="9"/>
  <text class="node-title" x="698" y="438">Model gateway</text>
  <text class="detail" x="698" y="464">Security + correctness system prompt</text>
  <text class="detail" x="698" y="487">Temperature 0, bounded output</text>
  <text class="detail" x="698" y="510">Retry transient failures up to 3 times</text>
  <text class="small" x="698" y="534">One format-only correction if needed</text>

  <text class="step" x="978" y="392">04  VERIFY</text>
  <rect class="gate" x="978" y="407" width="360" height="142" rx="9"/>
  <text class="gate-title" x="1000" y="438">Strict verdict contract</text>
  <text class="gate-detail" x="1000" y="465">Exact schema + full-diff digest match</text>
  <text class="gate-detail" x="1000" y="488">Finding files must exist in the partition</text>
  <text class="gate-detail" x="1000" y="511">Severity determines risk + blocking</text>
  <text class="gate-detail" x="1000" y="534">No invented low-risk fallback</text>

  <path class="flow" d="M332 478 H378"/>
  <path class="flow" d="M632 478 H678"/>
  <path class="flow" d="M932 478 H978"/>

  <path class="flow" d="M1158 549 V668 H1190 V698"/>
  <path class="flow" d="M1158 549 V662 H720 V698"/>
  <path class="telemetry" d="M805 549 V654 H250 V698"/>

  <rect class="group violet-group" x="54" y="698" width="392" height="110" rx="12"/>
  <text class="section" x="78" y="726">METADATA-ONLY TELEMETRY</text>
  <text class="node-title" x="78" y="756">OpenTelemetry trace</text>
  <text class="detail" x="78" y="780">Status, latency, attempts, model alias, input bytes</text>
  <text class="small" x="78" y="799">No diff, prompt, completion, credential, endpoint, or username</text>

  <rect class="group amber-group" x="474" y="698" width="484" height="110" rx="12"/>
  <text class="section" x="498" y="726">MACHINE OUTPUT</text>
  <text class="node-title" x="498" y="756">Validated JSON verdict</text>
  <text class="detail" x="498" y="780">risk + blocked + findings + rationale + input_sha256</text>
  <text class="small" x="498" y="799">Suitable for evaluation, CI, or another automation layer</text>

  <rect class="group green-group" x="986" y="698" width="400" height="110" rx="12"/>
  <text class="section" x="1010" y="726">GITHUB OUTPUT</text>
  <text class="node-title" x="1010" y="756">Review comment + commit status</text>
  <text class="detail" x="1010" y="780">Success when clear, failure for major or blocker findings</text>
  <text class="small" x="1010" y="799">Versioned head marker prevents duplicate reviews after restart</text>

  <text class="small" x="54" y="837">The model proposes findings. Deterministic code owns input identity, schema validity, severity consistency, and the final publishable contract.</text>
</svg>
